[agentwatch:otel]
SHOULD_LINEMERGE = false
LINE_BREAKER     = ([\r\n]+)
KV_MODE          = json
TIME_PREFIX      = "timestamp"\s*:\s*
TIME_FORMAT      = %s.%3N
MAX_TIMESTAMP_LOOKAHEAD = 32
TRANSFORMS-event_type   = agentwatch_event_type
TRANSFORMS-trust_score  = agentwatch_trust_score
TRANSFORMS-agent_id     = agentwatch_agent_id
TRANSFORMS-trace_id     = agentwatch_trace_id
TRANSFORMS-anomaly_type = agentwatch_anomaly_type
TRANSFORMS-severity     = agentwatch_severity
TRANSFORMS-tool_name    = agentwatch_tool_name
TRANSFORMS-tokens       = agentwatch_tokens
TRANSFORMS-duration     = agentwatch_duration
