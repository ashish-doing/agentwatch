[agentwatch_event_type]
REGEX = "event_type"\s*:\s*"([^"]+)"
FORMAT = event_type::$1
SOURCE_KEY = _raw

[agentwatch_trust_score]
REGEX = "trust_score"\s*:\s*([\d.]+)
FORMAT = trust_score::$1
SOURCE_KEY = _raw

[agentwatch_agent_id]
REGEX = "agent_id"\s*:\s*"([^"]+)"
FORMAT = agent_id::$1
SOURCE_KEY = _raw

[agentwatch_trace_id]
REGEX = "trace_id"\s*:\s*"([^"]+)"
FORMAT = trace_id::$1
SOURCE_KEY = _raw

[agentwatch_anomaly_type]
REGEX = "anomaly_type"\s*:\s*"([^"]+)"
FORMAT = anomaly_type::$1
SOURCE_KEY = _raw

[agentwatch_severity]
REGEX = "severity"\s*:\s*"([^"]+)"
FORMAT = severity::$1
SOURCE_KEY = _raw

[agentwatch_tool_name]
REGEX = "tool_name"\s*:\s*"([^"]+)"
FORMAT = tool_name::$1
SOURCE_KEY = _raw

[agentwatch_tokens]
REGEX = "llm_total_tokens"\s*:\s*(\d+)
FORMAT = llm_total_tokens::$1
SOURCE_KEY = _raw

[agentwatch_duration]
REGEX = "duration_ms"\s*:\s*([\d.]+)
FORMAT = duration_ms::$1
SOURCE_KEY = _raw
