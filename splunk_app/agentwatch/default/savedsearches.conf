[AgentWatch - All Anomalies]
search = index=agentwatch event_type=anomaly | sort -_time | table _time, agent_id, anomaly_type, severity, trust_score, reasoning_content, trace_id
dispatch.earliest_time = -24h
dispatch.latest_time   = now
enableSched = 0

[AgentWatch - Loop Detection]
search = index=agentwatch event_type=tool_call | stats count by trace_id, tool_name | where count >= 5 | sort -count
dispatch.earliest_time = -1h
dispatch.latest_time   = now
enableSched = 0

[AgentWatch - Trust Score Timeline]
search = index=agentwatch trust_score=* | timechart span=5m avg(trust_score) by agent_id
dispatch.earliest_time = -6h
dispatch.latest_time   = now
enableSched = 0

[AgentWatch - Token Spike Alert]
search = index=agentwatch event_type=llm_call llm_total_tokens>=3000 | table _time, agent_id, trace_id, llm_total_tokens, step_name
dispatch.earliest_time = -1h
dispatch.latest_time   = now
enableSched = 0

[AgentWatch - Latency Drift]
search = index=agentwatch event_type=step_end duration_ms>=3000 | sort -duration_ms | table _time, agent_id, step_name, duration_ms, trust_score
dispatch.earliest_time = -1h
dispatch.latest_time   = now
enableSched = 0

[AgentWatch - Agent Health KPIs]
search = index=agentwatch | stats count as total_events, count(eval(event_type="anomaly")) as anomalies, avg(trust_score) as avg_trust, dc(trace_id) as runs by agent_id
dispatch.earliest_time = -24h
dispatch.latest_time   = now
enableSched = 0

[AgentWatch - Critical Anomaly Alert]
search = index=agentwatch event_type=anomaly severity=critical
dispatch.earliest_time = -15m
dispatch.latest_time   = now
enableSched = 1
cron_schedule = */5 * * * *
alert.track = 1
alert.severity = 4
alert.expires = 24h
counttype = number of events
relation = greater than
quantity = 0
alert.suppress = 0
