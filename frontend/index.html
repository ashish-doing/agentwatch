<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentWatch — AI Agent Observability</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root {
      --bg: #050810;
      --panel: rgba(8, 14, 30, 0.85);
      --border: rgba(100, 160, 255, 0.15);
      --accent: #4f8fff;
      --accent2: #00e5ff;
      --green: #00ff88;
      --yellow: #ffcc00;
      --orange: #ff8800;
      --red: #ff3355;
      --text: #c8d8f0;
      --text-dim: #5a7090;
      --mono: 'Space Mono', monospace;
      --sans: 'Syne', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* ── Canvas ── */
    #brain-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* ── Layout ── */
    #ui-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: grid;
      grid-template-columns: 280px 1fr 300px;
      grid-template-rows: 64px 1fr 90px 110px 160px;
      gap: 0;
      padding: 12px;
    }

    /* ── Header ── */
    #header {
      grid-column: 1 / -1;
      grid-row: 1;
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 0 8px;
      pointer-events: all;
    }

    .logo {
      font-family: var(--sans);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-sub {
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 3px;
      text-transform: uppercase;
      -webkit-text-fill-color: var(--text-dim);
    }

    .stat-chips {
      display: flex;
      gap: 12px;
      margin-left: auto;
    }

    .stat-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 16px;
      min-width: 80px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent2);
      line-height: 1;
    }

    .stat-label {
      font-size: 9px;
      color: var(--text-dim);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 3px;
    }

    /* ── Left Panel — Event Feed ── */
    #event-feed {
      grid-column: 1;
      grid-row: 2;
      pointer-events: all;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin: 60px 4px 8px 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-header .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    #feed-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    #feed-list::-webkit-scrollbar { width: 3px; }
    #feed-list::-webkit-scrollbar-track { background: transparent; }
    #feed-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .feed-item {
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 4px;
      font-size: 10px;
      line-height: 1.5;
      border-left: 2px solid transparent;
      animation: slide-in 0.2s ease;
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateX(-8px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .feed-item.llm_call { border-color: var(--accent); background: rgba(79,143,255,0.06); }
    .feed-item.tool_call { border-color: var(--accent2); background: rgba(0,229,255,0.06); }
    .feed-item.step_start { border-color: var(--text-dim); background: rgba(90,112,144,0.06); }
    .feed-item.step_end { border-color: var(--green); background: rgba(0,255,136,0.06); }
    .feed-item.anomaly { border-color: var(--red); background: rgba(255,51,85,0.1); }
    .feed-item.error { border-color: var(--orange); background: rgba(255,136,0,0.1); }

    .feed-type {
      font-size: 8px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.6;
      margin-bottom: 2px;
    }

    .feed-name {
      font-weight: 700;
      color: var(--text);
    }

    .feed-meta {
      color: var(--text-dim);
      font-size: 9px;
    }

    /* ── Right Panel — Inspector ── */
    #inspector {
      grid-column: 3;
      grid-row: 2;
      pointer-events: all;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin: 60px 0 8px 4px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #inspector-content {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      font-size: 11px;
      line-height: 1.7;
    }

    #inspector-content::-webkit-scrollbar { width: 3px; }
    #inspector-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .inspector-empty {
      color: var(--text-dim);
      text-align: center;
      padding-top: 40px;
      font-size: 10px;
      line-height: 2;
    }

    .inspector-field {
      margin-bottom: 12px;
    }

    .inspector-field label {
      display: block;
      font-size: 8px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .inspector-field value {
      display: block;
      color: var(--text);
      word-break: break-all;
    }

    .trust-bar {
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      margin-top: 4px;
      overflow: hidden;
    }

    .trust-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    /* ── Bottom — AI Assistant ── */
    #ai-assistant {
      grid-column: 1 / -1;
      grid-row: 5;
      pointer-events: all;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin: 4px 0 0 0;
      display: flex;
      gap: 0;
      overflow: hidden;
      min-height: 0;
    }

    #query-panel {
      min-height: 0;
      overflow-y: auto;
    }

    #sparklines-row {
      grid-column: 1 / -1;
      grid-row: 3;
      pointer-events: all;
      display: flex;
      align-items: stretch;
      gap: 8px;
      padding: 8px 0;
    }

    #sparklines-row > div {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
    }

    #timeline-panel {
      grid-column: 1 / -1;
      grid-row: 4;
      margin: 0 0 4px 0;
    }

    #query-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
    }

    #query-input-row {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }

    #nl-query {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text);
      caret-color: var(--accent2);
    }

    #nl-query::placeholder { color: var(--text-dim); }

    #query-submit {
      background: var(--accent);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 10px;
      cursor: pointer;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: background 0.15s;
    }

    #query-submit:hover { background: var(--accent2); color: var(--bg); }

    #spl-output {
      padding: 10px 16px;
      font-size: 10px;
      color: var(--accent2);
      overflow: auto;
      flex: 1;
      max-height: 60px;
    }

    #results-panel {
      width: 220px;
      flex-shrink: 0;
      padding: 12px 16px;
      overflow-y: auto;
      font-size: 10px;
      border-left: 1px solid var(--border);
    }

    #results-panel:empty,
    #results-list:empty {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .result-row {
      padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      display: flex;
      gap: 8px;
    }

    .result-key { color: var(--text-dim); min-width: 80px; }
    .result-val { color: var(--text); }

    /* ── Anomaly Alert Overlay ── */
    #anomaly-overlay {
      position: fixed;
      top: 76px;
      right: 16px;
      z-index: 100;
      display: none;
      flex-direction: column;
      gap: 8px;
      width: 320px;
      max-height: calc(100vh - 200px);
      overflow-y: auto;
      pointer-events: all;
    }

    #anomaly-overlay::-webkit-scrollbar { width: 3px; }
    #anomaly-overlay::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .anomaly-card {
      background: rgba(255,20,50,0.12);
      border: 1px solid var(--red);
      border-radius: 10px;
      padding: 10px 12px;
      animation: alert-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      backdrop-filter: blur(12px);
      font-size: 10px;
    }

    .anomaly-card .anomaly-title { font-size: 11px; }
    .anomaly-card .anomaly-body { font-size: 9px; }
    .anomaly-card .anomaly-header { margin-bottom: 6px; }
    .anomaly-card .anomaly-icon { font-size: 16px; }
    .anomaly-card .anomaly-actions { margin-top: 8px; gap: 6px; flex-wrap: wrap; }
    .anomaly-card .anomaly-actions .btn { font-size: 8px; padding: 4px 8px; }
    .anomaly-card > div[style*="background:rgba(0,0,0,0.3)"] { padding: 6px 8px !important; margin: 6px 0 !important; }

    @keyframes alert-in {
      from { opacity: 0; transform: scale(0.9) translateY(-20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .anomaly-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .anomaly-icon { font-size: 20px; }

    .anomaly-title {
      font-family: var(--sans);
      font-weight: 700;
      font-size: 14px;
      color: var(--red);
    }

    .anomaly-body { font-size: 11px; line-height: 1.6; color: var(--text); }

    .anomaly-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .btn {
      padding: 6px 14px;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s;
    }

    .btn-primary { background: var(--red); color: white; border-color: var(--red); }
    .btn-primary:hover { background: transparent; color: var(--red); }
    .btn-secondary { background: transparent; color: var(--text-dim); border-color: var(--border); }
    .btn-secondary:hover { color: var(--text); border-color: var(--text-dim); }

    /* ── Foundation-Sec Reasoning Panel ── */
    #reasoning-panel {
      position: fixed;
      right: 16px;
      top: 76px;
      bottom: 180px;
      width: 380px;
      z-index: 95;
      display: none;
      pointer-events: all;
      overflow-y: auto;
    }

    #reasoning-panel::-webkit-scrollbar { width: 3px; }
    #reasoning-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    #reasoning-panel .reasoning-card {
      max-height: none;
    }

    .reasoning-card {
      background: rgba(5, 8, 20, 0.95);
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 20px;
      backdrop-filter: blur(20px);
      animation: slide-up 0.3s ease;
    }

    @keyframes slide-up {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .reasoning-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .reasoning-title {
      font-family: var(--sans);
      font-weight: 700;
      font-size: 13px;
      color: var(--accent2);
    }

    .reasoning-close {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 16px;
      padding: 0 4px;
    }

    .reasoning-section {
      margin-bottom: 14px;
    }

    .reasoning-section h4 {
      font-size: 8px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .reasoning-section p {
      font-size: 11px;
      line-height: 1.7;
      color: var(--text);
    }

    .severity-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 4px;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .severity-critical { background: rgba(255,51,85,0.2); color: var(--red); border: 1px solid var(--red); }
    .severity-high { background: rgba(255,136,0,0.2); color: var(--orange); border: 1px solid var(--orange); }
    .severity-medium { background: rgba(255,204,0,0.2); color: var(--yellow); border: 1px solid var(--yellow); }
    .severity-low { background: rgba(0,255,136,0.2); color: var(--green); border: 1px solid var(--green); }

    .spl-code {
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      font-size: 10px;
      color: var(--accent2);
      word-break: break-all;
      margin-top: 6px;
    }

    /* When the reasoning/autopsy panel is visible, anomaly toasts
       compress to a slim strip so both are visible. */
    body:has(#reasoning-panel[style*="display: block"]) #anomaly-overlay,
    body:has(#reasoning-panel[style*="display:block"]) #anomaly-overlay {
      max-height: 140px;
      width: 280px;
    }

    /* ── Live Demo Controls ── */
    #demo-controls {
      position: fixed;
      top: 96px;
      left: 308px;
      right: 16px;
      z-index: 50;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      pointer-events: all;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px;
      flex-wrap: wrap;
    }

    #demo-status {
      font-size: 9px;
      color: var(--text-dim);
      flex: 1;
      min-width: 200px;
      text-align: right;
    }

    #demo-controls > div:first-child,
    #demo-controls .demo-label {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    #demo-controls .demo-label {
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    #demo-buttons {
      display: flex;
      gap: 6px;
    }

    .demo-btn {
      padding: 8px 14px;
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      transition: all 0.15s;
    }

    .demo-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent2);
    }

    .demo-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .demo-btn.loop { border-color: rgba(255,51,85,0.3); }
    .demo-btn.loop:hover:not(:disabled) { border-color: var(--red); color: var(--red); }

    .demo-btn.hallucinate { border-color: rgba(255,204,0,0.3); }
    .demo-btn.hallucinate:hover:not(:disabled) { border-color: var(--yellow); color: var(--yellow); }

    .demo-btn.drift { border-color: rgba(255,136,0,0.3); }
    .demo-btn.drift:hover:not(:disabled) { border-color: var(--orange); color: var(--orange); }

    #demo-status {
      font-size: 9px;
      color: var(--text-dim);
      max-width: 100%;
      text-align: left;
      flex: none;
      width: 100%;
    }

    /* ── Connection status ── */
    #conn-status {
      position: fixed;
      top: 16px;
      right: 16px;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-dim);
      z-index: 65;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
    }

    /* ── Splunk deep-link button ── */
    .splunk-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 9px;
      color: var(--accent);
      text-decoration: none;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

<canvas id="brain-canvas"></canvas>

<!-- Main UI grid -->
<div id="ui-layer">

  <!-- Header -->
  <header id="header">
    <div>
      <div class="logo">AgentWatch</div>
      <div class="logo-sub">AI Agent Observability</div>
    </div>
    <div class="stat-chips">
      <div class="stat-chip">
        <div class="stat-value" id="stat-events">0</div>
        <div class="stat-label">Events</div>
      </div>
      <div class="stat-chip">
        <div class="stat-value" id="stat-anomalies" style="color:var(--red)">0</div>
        <div class="stat-label">Anomalies</div>
      </div>
      <div class="stat-chip">
        <div class="stat-value" id="stat-trust">1.00</div>
        <div class="stat-label">Avg Trust</div>
      </div>
      <div class="stat-chip">
        <div class="stat-value" id="stat-agents">0</div>
        <div class="stat-label">Agents</div>
      </div>
      <div id="health-score-widget"></div>
    </div>
  </header>

  <!-- Left: Event Feed -->
  <aside id="event-feed">
    <div class="panel-header">
      <div class="dot"></div>
      Live Events
    </div>
    <div id="feed-list"></div>
  </aside>

  <!-- Right: Inspector -->
  <aside id="inspector">
    <div class="panel-header">Node Inspector</div>
    <div id="inspector-content">
      <div class="inspector-empty">
        Click a node in the brain<br>to inspect it
      </div>
    </div>
  </aside>

  <!-- Sparklines -->
  <div id="sparklines-row"></div>

  <!-- Trace Timeline -->
  <div id="timeline-panel" style="
    pointer-events: all;
    background: rgba(8,14,30,0.7);
    border: 1px solid rgba(100,160,255,0.15);
    border-radius: 8px;
    margin: 4px 0 0 0;
    overflow: auto;
  "></div>

  <!-- Bottom: AI Assistant -->
  <section id="ai-assistant">
    <div id="query-panel">
      <div id="query-input-row">
        <span style="color:var(--text-dim);font-size:12px">›</span>
        <input id="nl-query" placeholder='Ask Splunk AI Assistant: "Show me all loops in the last hour"' />
        <button id="query-submit" onclick="submitQuery()">Run</button>
      </div>
      <div id="spl-output">SPL will appear here...</div>
    </div>
    <div id="results-panel">
      <div style="color:var(--text-dim);font-size:9px;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px">Results</div>
      <div id="results-list">
        <div style="color:var(--text-dim);font-size:9px;line-height:1.6;opacity:0.6">
          Type a question above and click Run to query Splunk via the AI Assistant.
        </div>
      </div>
    </div>
  </section>

</div>

<!-- Anomaly Alert Overlay -->
<div id="anomaly-overlay">
</div>

<!-- Foundation-Sec Reasoning Panel -->
<div id="reasoning-panel">
</div>

<!-- Connection status -->
<div id="conn-status">⬤ Connecting...</div>

<!-- Live Demo Controls -->
<div id="demo-controls">
  <div style="display:flex;align-items:center;gap:10px;width:100%">
    <span class="demo-label" style="white-space:nowrap">Try It Live</span>
    <div id="demo-buttons">
      <button class="demo-btn" data-mode="normal" onclick="triggerDemo('normal')">Normal</button>
      <button class="demo-btn loop" data-mode="loop" onclick="triggerDemo('loop')">Loop</button>
      <button class="demo-btn hallucinate" data-mode="hallucinate" onclick="triggerDemo('hallucinate')">Hallucinate</button>
      <button class="demo-btn drift" data-mode="drift" onclick="triggerDemo('drift')">Drift</button>
    </div>
  </div>
  <div id="demo-status"></div>
</div>

<script>
  const API_BASE = (() => {
    if (window.location.port === '3000') return 'http://localhost:8001';
    return '';
  })();

  let demoBusy = false;

  async function triggerDemo(mode) {
    if (demoBusy) return;
    demoBusy = true;
    setDemoButtonsDisabled(true);
    const statusEl = document.getElementById('demo-status');
    statusEl.textContent = `Running ${mode} mode... watch the feed & brain graph above`;
    statusEl.style.color = 'var(--accent2)';

    try {
      const res = await fetch(`${API_BASE}/api/demo/trigger`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode }),
      });

      if (res.status === 429) {
        statusEl.textContent = 'Another visitor is running a demo — try again in a few seconds.';
        statusEl.style.color = 'var(--orange)';
        return;
      }

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        statusEl.textContent = `Error: ${err.detail || res.statusText}`;
        statusEl.style.color = 'var(--red)';
        return;
      }

      const data = await res.json();
      statusEl.textContent = `Done — trace ${data.trace_id?.slice(0, 8) || ''}. ${data.message}`;
      statusEl.style.color = 'var(--green)';
    } catch (e) {
      statusEl.textContent = `Network error: ${e.message}`;
      statusEl.style.color = 'var(--red)';
    } finally {
      demoBusy = false;
      setDemoButtonsDisabled(false);
    }
  }

  function setDemoButtonsDisabled(disabled) {
    document.querySelectorAll('.demo-btn').forEach((btn) => {
      btn.disabled = disabled;
    });
  }
</script>
