# agentwatch/railway.toml
# Place this in repo root. Tells Railway to build via Dockerfile.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c \"uvicorn backend.api.main:app --host 0.0.0.0 --port ${PORT:-8001}\""
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
healthcheckPath = "/"
healthcheckTimeout = 30