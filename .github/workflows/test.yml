name: AgentWatch CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          # Install only what's needed for tests — no Splunk/OTel connection required
          pip install langgraph langchain-core opentelemetry-api opentelemetry-sdk httpx pydantic fastapi

      - name: Run anomaly detector tests
        run: |
          pytest backend/tests/test_anomaly.py -v --tb=short

      - name: Show test summary
        if: always()
        run: |
          echo "Tests completed."